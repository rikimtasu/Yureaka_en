; Configuration for Akatsuki Yureru Koi Akari (yureaka_en) English Font & Window Hook
; Place alongside yureaka.exe, version.dll, yureaka_en.dat, csv.pac, and en_fonts\.

[General]
Enable=1
EnableTextOverlay=1
TextOverlayFile=yureaka_en.dat
; Set Log=1 to write diagnostic hook output to yureaka_en.log (0 for normal play)
Log=0

[Font]
; Redirect Softpal bitmap font (type 4 / DEFAULT_FONT.DAT) to proportional GDI font (type 2)
ForceGdiFont=1

; Compact Google Font TTF bundled in en_fonts\ (choose one or drop your own TTF):
;   Option 1 (Default - Highest density & clean modern look): BarlowSemiCondensed-Medium.ttf / "Barlow Semi Condensed Medium"
;   Option 2 (Crisp UI look):                                 FiraSansCondensed-Medium.ttf   / "Fira Sans Condensed Medium"
;   Option 3 (Lighter crisp UI look):                         FiraSansCondensed-Regular.ttf  / "Fira Sans Condensed"
;   Option 4 (Smooth modern VN look):                         EncodeSansSemiCondensed-Medium.ttf / "Encode Sans Semi Condensed Medium"
FontFile=en_fonts\BarlowSemiCondensed-Medium.ttf
FaceName=Barlow Semi Condensed Medium
Weight=400

; Line height replacing game default 26px (28px gives comfortable 3-line readability)
DefaultSize=28
; GDI CreateFontA cell-height multiplier (%) (28 * 104% = 29px; descenders + outline = 29px <= 30px, zero clipping)
HeightScalePercent=104
; Adjusts PalFontGetSize per-char advance (Pal.dll adds +3px; -2 leaves crisp +1px outline spacing)
CharSpacingDelta=-2
; ASCII space width as % of CreateFontA height (~8px at 29px, instead of Softpal's giant 17px)
SpaceWidthPercent=26

; 1 = DEFAULT_CHARSET (loads Google Font + clean JP fallback for untranslated lines)
CharSet=1
; 4 = ANTIALIASED_QUALITY (cleanest for Pal.dll GetGlyphOutlineA)
Quality=4

[Window]
OverrideTitle=1
Title=Akatsuki Yureru Koi Akari
